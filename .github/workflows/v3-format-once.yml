name: v3-format-once

on:
  push:
    branches:
      - agent/complete-v3-integrations
    paths:
      - .github/workflows/v3-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/complete-v3-integrations
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Format and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            cmd/nexdrop/main.go \
            internal/api/v3.go \
            internal/enrollment/service.go \
            internal/postgres/v3_store.go \
            internal/v3/service.go
          rm .github/workflows/v3-format-once.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "style: format v3 integrations"
          git push origin HEAD:agent/complete-v3-integrations
