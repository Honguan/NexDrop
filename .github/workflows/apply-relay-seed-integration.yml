name: apply-relay-seed-integration

on:
  push:
    branches:
      - agent/complete-v3-integrations
    paths:
      - .github/workflows/apply-relay-seed-integration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/complete-v3-integrations
      - name: Apply independent relay signing seed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              text = path.read_text()
              if text.count(old) < count:
                  raise SystemExit(f'missing marker in {path}: {old[:120]!r}')
              path.write_text(text.replace(old, new, count))

          main = Path('cmd/nexdrop/main.go')
          replace(main,
              'if len(nodeID) < 8 {\n\t\tfatal("configuration failed", errors.New("NEXDROP_NODE_ID must contain at least 8 characters"))\n\t}',
              'if len(nodeID) < 8 {\n\t\tfatal("configuration failed", errors.New("NEXDROP_NODE_ID must contain at least 8 characters"))\n\t}\n\trelaySigningSeed := strings.TrimSpace(os.Getenv("NEXDROP_RELAY_SIGNING_SEED"))\n\tif len(relaySigningSeed) < 32 {\n\t\tfatal("configuration failed", errors.New("NEXDROP_RELAY_SIGNING_SEED must contain at least 32 characters"))\n\t}')
          replace(main,
              'v3Service, err := v3.New(store, nodeID, []byte(nodeKey), []byte(cursorSecret), storagePath)',
              'v3Service, err := v3.NewWithRelaySeed(store, nodeID, []byte(nodeKey), []byte(cursorSecret), []byte(relaySigningSeed), storagePath)')
          replace(main,
              '\tservice, err := v3.New(\n\t\tstore,\n\t\tstrings.TrimSpace(os.Getenv("NEXDROP_NODE_ID")),\n\t\t[]byte(strings.TrimSpace(os.Getenv("NEXDROP_NODE_KEY"))),\n\t\t[]byte(os.Getenv("NEXDROP_CURSOR_SECRET")),\n\t\tstoragePath,\n\t)',
              '\tservice, err := v3.NewWithRelaySeed(\n\t\tstore,\n\t\tstrings.TrimSpace(os.Getenv("NEXDROP_NODE_ID")),\n\t\t[]byte(strings.TrimSpace(os.Getenv("NEXDROP_NODE_KEY"))),\n\t\t[]byte(os.Getenv("NEXDROP_CURSOR_SECRET")),\n\t\t[]byte(strings.TrimSpace(os.Getenv("NEXDROP_RELAY_SIGNING_SEED"))),\n\t\tstoragePath,\n\t)')

          deploy = Path('deploy/nexdrop')
          replace(deploy,
              'install|configure|configure-secrets|update|status|logs|backup|restore|doctor|diagnostics|cleanup|reset-password|uninstall)',
              'install|configure|configure-secrets|update|status|logs|backup|restore|doctor|diagnostics|cleanup|transfers|reset-password|uninstall)')
          replace(deploy,
              '    set_env_value NEXDROP_NODE_KEY "$(random_hex 32)"\n    set_env_value NEXDROP_BOOTSTRAP_ADMIN_TOTP_SECRET',
              '    set_env_value NEXDROP_NODE_KEY "$(random_hex 32)"\n    set_env_value NEXDROP_RELAY_SIGNING_SEED "$(random_hex 32)"\n    set_env_value NEXDROP_BOOTSTRAP_ADMIN_TOTP_SECRET')
          replace(deploy,
              '    node_id=$(env_value NEXDROP_NODE_ID)\n    totp_secret=',
              '    node_id=$(env_value NEXDROP_NODE_ID)\n    relay_signing_seed=$(env_value NEXDROP_RELAY_SIGNING_SEED)\n    totp_secret=')
          replace(deploy,
              '    if [ "${#node_id}" -lt 8 ] || [ "${#node_id}" -gt 128 ]; then',
              '    if ! valid_minimum_length "$relay_signing_seed" 32; then\n        echo "NEXDROP_RELAY_SIGNING_SEED 必須至少 32 字元；請重新執行 ./deploy/nexdrop update 讓系統自動補齊。" >&2\n        return 1\n    fi\n    if [ "${#node_id}" -lt 8 ] || [ "${#node_id}" -gt 128 ]; then')
          replace(deploy,
              '    case "$(env_value NEXDROP_NODE_ID)" in',
              '    case "$(env_value NEXDROP_RELAY_SIGNING_SEED)" in\n        \'\'|change-me|replace-with-openssl-rand-hex-32)\n            set_env_value NEXDROP_RELAY_SIGNING_SEED "$(random_hex 32)"\n            GENERATED_DEFAULTS=true\n            echo "已自動產生缺少的 Relay 簽章種子；後續更新會保留此值。"\n            ;;\n    esac\n    case "$(env_value NEXDROP_NODE_ID)" in')
          replace(deploy,
              '  節點密鑰：$(env_value NEXDROP_NODE_KEY)\n  Web OTP 密鑰：',
              '  節點密鑰：$(env_value NEXDROP_NODE_KEY)\n  Relay 簽章種子：$(env_value NEXDROP_RELAY_SIGNING_SEED)\n  Web OTP 密鑰：')
          replace(deploy,
              '    cleanup) docker compose run --rm nexdrop cleanup "$@" ;;\n    reset-password)',
              '    cleanup) docker compose run --rm nexdrop cleanup "$@" ;;\n    transfers) docker compose run --rm nexdrop transfers "$@" ;;\n    reset-password)')
          replace(deploy,
              'backup|restore|cleanup|doctor|diagnostics [--output diagnostics.zip]|reset-password|uninstall}',
              'backup|restore|cleanup|transfers {failed|inspect|retry|reconcile}|doctor|diagnostics [--output diagnostics.zip]|reset-password|uninstall}')

          integration = Path('.github/workflows/integration-test.yml')
          replace(integration,
              '      NEXDROP_NODE_ID: integration-test-node\n      NEXDROP_STORAGE_PATH:',
              '      NEXDROP_NODE_ID: integration-test-node\n      NEXDROP_RELAY_SIGNING_SEED: integration-test-only-relay-seed-32-bytes\n      NEXDROP_STORAGE_PATH:')
          docker = Path('.github/workflows/docker-build.yml')
          replace(docker,
              '          NEXDROP_NODE_ID: docker-test-node\n          NEXDROP_IMAGE:',
              '          NEXDROP_NODE_ID: docker-test-node\n          NEXDROP_RELAY_SIGNING_SEED: docker-test-only-relay-seed-32-bytes\n          NEXDROP_IMAGE:')
          PY
          gofmt -w cmd/nexdrop/main.go internal/relay/pool.go internal/relay/server.go internal/v3/relay_signing.go cmd/nexdrop-relay/main.go
          rm .github/workflows/apply-relay-seed-integration.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "security: integrate independent relay signing"
          git push origin HEAD:agent/complete-v3-integrations
